name: UserScript Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ".bun-version"

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Verify tag matches package.json version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        PKG_VERSION=$(jq -r .version package.json)
        if [ "$VERSION" != "$PKG_VERSION" ]; then
          echo "Tag version ($VERSION) does not match package.json version ($PKG_VERSION)" >&2
          exit 1
        fi

    - name: Wait for tests on this commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for attempt in {1..30}; do
          RUN_ID=$(gh run list --workflow test.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            break
          fi
          sleep 10
        done
        if [ -z "$RUN_ID" ]; then
          echo "No test workflow run found for $GITHUB_SHA" >&2
          exit 1
        fi
        timeout 20m gh run watch "$RUN_ID" --exit-status --compact --interval 10

    - name: Build userscript
      run: bun run build

    - name: Create Release (draft)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --draft \
          --title "Release ${GITHUB_REF_NAME}" \
          dist/seesaawiki-enhancer.user.js \
          dist/seesaawiki-enhancer.meta.js
